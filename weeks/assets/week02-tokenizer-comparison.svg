<rect x="339" y="134" width="74" height="42" rx="4" fill="#ede9fe" stroke="#cbd5e1" stroke-width="0.6"/>
<text x="357" y="164" text-anchor="middle" font-size="27" fill="#0f172a">공</text>
<text x="395" y="164" text-anchor="middle" font-size="27" fill="#0f172a">부</text>
<rect x="415" y="134" width="36" height="42" rx="4" fill="#dbeafe" stroke="#cbd5e1" stroke-width="0.6"/>
<text x="433" y="164" text-anchor="middle" font-size="27" fill="#0f172a">합</text>
<rect x="453" y="134" width="74" height="42" rx="4" fill="#dcfce7" stroke="#cbd5e1" stroke-width="0.6"/>
<text x="471" y="164" text-anchor="middle" font-size="27" fill="#0f172a">니</text>
<text x="509" y="164" text-anchor="middle" font-size="27" fill="#0f172a">다</text>
<rect x="529" y="134" width="36" height="42" rx="4" fill="#ffe4e6" stroke="#cbd5e1" stroke-width="0.6"/>
<text x="547" y="164" text-anchor="middle" font-size="27" fill="#0f172a">.</text>
<text x="300" y="207" text-anchor="middle" font-size="17" fill="#64748b">색 묶음 하나 = 토큰 하나 · ␠ = 공백</text>
</svg>
