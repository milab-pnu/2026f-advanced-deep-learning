<text x="205" y="164" text-anchor="middle" font-size="27" fill="#0f172a">교</text>
<rect x="225" y="134" width="74" height="42" rx="4" fill="#fef3c7" stroke="#cbd5e1" stroke-width="0.6"/>
<text x="243" y="164" text-anchor="middle" font-size="27" fill="#0f172a">에</text>
<text x="281" y="164" text-anchor="middle" font-size="27" fill="#0f172a">서</text>
<rect x="301" y="134" width="36" height="42" rx="4" fill="#cffafe" stroke="#cbd5e1" stroke-width="0.6"/>
