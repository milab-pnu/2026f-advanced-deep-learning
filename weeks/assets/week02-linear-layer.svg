<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="title desc" font-family="Arial, Apple SD Gothic Neo, sans-serif">
<title id="title">한 토큰의 입력 x, 가중치 W, 출력 y</title>
<desc id="desc">입력 성분 네 개와 출력 성분 세 개를 12개의 가중치가 모두 연결한다. Forward는 왼쪽에서 오른쪽으로, 입력에 대한 backward는 오른쪽에서 왼쪽으로 계산한다. 강조된 연결은 x2와 y1 사이의 w21이다.</desc>
<rect width="640" height="560" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#0f172a" stroke-width="1.3"/></marker></defs>
<text x="320" y="30" text-anchor="middle" font-size="24" fill="#0f172a" font-weight="600">한 토큰의 선형층: y = xW</text>
<text x="140" y="77" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="600">Input x</text>
<text x="500" y="77" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="600">Output y</text>
<text x="320" y="65" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="400">Forward</text>
<line x1="240" y1="82" x2="400" y2="82" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320" y="115" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="600">Weight W</text>
<line x1="140" y1="145" x2="500" y2="180" stroke="#cbd5e1" stroke-width="1.6"/>
<line x1="140" y1="145" x2="500" y2="250" stroke="#cbd5e1" stroke-width="1.6"/>
<line x1="140" y1="145" x2="500" y2="320" stroke="#cbd5e1" stroke-width="1.6"/>
<line x1="140" y1="215" x2="500" y2="180" stroke="#cbd5e1" stroke-width="1.6"/>
<line x1="140" y1="215" x2="500" y2="250" stroke="#cbd5e1" stroke-width="1.6"/>
<line x1="140" y1="215" x2="500" y2="320" stroke="#cbd5e1" stroke-width="1.6"/>
<line x1="140" y1="285" x2="500" y2="180" stroke="#cbd5e1" stroke-width="1.6"/>
<line x1="140" y1="285" x2="500" y2="250" stroke="#cbd5e1" stroke-width="1.6"/>
<line x1="140" y1="285" x2="500" y2="320" stroke="#cbd5e1" stroke-width="1.6"/>
<line x1="140" y1="355" x2="500" y2="180" stroke="#cbd5e1" stroke-width="1.6"/>
<line x1="140" y1="355" x2="500" y2="250" stroke="#cbd5e1" stroke-width="1.6"/>
<line x1="140" y1="355" x2="500" y2="320" stroke="#cbd5e1" stroke-width="1.6"/>
<line x1="140" y1="215" x2="500" y2="180" stroke="#0f172a" stroke-width="3"/>
<rect x="283" y="180" width="62" height="29" rx="6" fill="white"/>
<text x="314" y="201" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="600">w₂₁</text>
<circle cx="140" cy="145" r="25" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="140" y="152" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="400">x₁</text>
<circle cx="140" cy="215" r="25" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="140" y="222" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="400">x₂</text>
<circle cx="140" cy="285" r="25" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="140" y="292" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="400">x₃</text>
<circle cx="140" cy="355" r="25" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="140" y="362" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="400">x₄</text>
<circle cx="500" cy="180" r="25" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="500" y="187" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="400">y₁</text>
<circle cx="500" cy="250" r="25" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="500" y="257" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="400">y₂</text>
<circle cx="500" cy="320" r="25" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="500" y="327" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="400">y₃</text>
<text x="320" y="388" text-anchor="middle" font-size="19" fill="#64748b" font-weight="400">4 × 3 = 12 weights</text>
<line x1="418" y1="431" x2="222" y2="431" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320" y="419" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="400">Backward to x</text>
<text x="140" y="438" text-anchor="middle" font-size="23" fill="#0f172a" font-weight="400">∂ℓ/∂x</text>
<text x="500" y="438" text-anchor="middle" font-size="23" fill="#0f172a" font-weight="400">∂ℓ/∂y</text>
<line x1="70" y1="465" x2="570" y2="465" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="320" y="495" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="600">연결 하나의 gradient</text>
<text x="320" y="529" text-anchor="middle" font-size="23" fill="#0f172a" font-weight="400">w₂₁:  x₂ × (∂ℓ/∂y₁)</text>
</svg>
